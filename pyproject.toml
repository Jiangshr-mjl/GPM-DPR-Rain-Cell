[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpm-dpr-rain-cell"
version = "0.1.0"
description = "Eight-neighbor rain cluster identification for GPM DPR granules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]

[project.scripts]
gpm-raincell = "gpm_raincell.batch:main"

[tool.setuptools.packages.find]
include = ["gpm_raincell*"]
